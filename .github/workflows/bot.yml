name: Run Trading Bot

on:
  # Run automatically every 5 minutes on weekdays.
  #
  # GitHub cron is UTC by default. We intentionally run
  # a broad window and let bot.py determine whether the
  # market is actually inside our trading window.
  schedule:
    - cron: "2-59/5 13-20 * * 1-5"

  # Lets you manually run the bot from GitHub Actions.
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trading bot
        env:
          APCA_API_KEY_1: ${{ secrets.APCA_API_KEY_1 }}
          APCA_API_SECRET_1: ${{ secrets.APCA_API_SECRET_1 }}
          APCA_BASE_URL_1: ${{ secrets.APCA_BASE_URL_1 }}

          APCA_API_KEY_2: ${{ secrets.APCA_API_KEY_2 }}
          APCA_API_SECRET_2: ${{ secrets.APCA_API_SECRET_2 }}
          APCA_BASE_URL_2: ${{ secrets.APCA_BASE_URL_2 }}
        run: |
          python bot.py
